name: Build GreenHud
on:
  push:
  workflow_dispatch:
jobs:
  b:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build GreenHud.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: GreenHud
          path: bin/Release/net48/GreenHud.dll
